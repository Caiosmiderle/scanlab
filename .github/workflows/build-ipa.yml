name: build-ipa
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Um push novo cancela o build anterior da mesma branch.
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Versões das ferramentas
        run: |
          xcodebuild -version
          swift --version

      - name: Testes do ScanCore
        env:
          # Os testes gravam aqui arquivos de exemplo (planta SVG) para conferência visual.
          SCANLAB_SAMPLE_DIR: ${{ github.workspace }}/amostras
        run: swift test --package-path Packages/ScanCore

      - name: Validar glTF de exemplo com o validador da Khronos
        run: |
          npm install --no-save --no-audit --no-fund gltf-validator
          node tools/validate-gltf.js amostras/amostra-com-cor.glb amostras/amostra-sem-cor.glb amostras/amostra.gltf

      - uses: actions/upload-artifact@v4
        with:
          name: ScanLab-amostras
          path: amostras
          if-no-files-found: warn

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto
        run: |
          xcodegen generate
          xcodebuild -list -project ScanLab.xcodeproj

      - name: Build sem assinatura
        run: |
          set -o pipefail
          xcodebuild -project ScanLab.xcodeproj -scheme ScanLab \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Resumo de erros de compilação
        if: failure()
        run: |
          echo "==== erros ===="
          grep -n -E "error:|fatal error|BUILD FAILED" xcodebuild.log | head -n 80 || true

      - name: Empacotar .ipa
        run: |
          ls build/Build/Products
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ScanLab.app Payload/
          zip -qr ScanLab.ipa Payload
          ls -lh ScanLab.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ScanLab-ipa
          path: ScanLab.ipa
          if-no-files-found: error
